{{ define "main" }}
  <div class="page-shell error-page">
    {{ partial "ripple.html" (dict "variant" "error") }}
    <p class="eyebrow">ERROR / 404</p>
    <h1>这枚愿望没有抵达井底。</h1>
    <p>地址可能已经改变，也可能从未存在。你可以回到首页，或从归档继续寻找。</p>
    <div class="error-page__links">
      <a class="text-link" href="{{ site.Home.RelPermalink }}">返回首页 <span aria-hidden="true">→</span></a>
      <a class="text-link" href="{{ "archives/" | relURL }}">浏览归档 <span aria-hidden="true">→</span></a>
    </div>
  </div>
{{ end }}
