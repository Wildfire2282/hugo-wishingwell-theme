name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hugo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$release/$archive"
          curl --fail --location --silent --show-error --output checksums.txt "$release/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check
          tar --extract --gzip --file "$archive" hugo
          sudo install --mode 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Guard tracked build artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch "public/*" "resources/_gen/*" "resources/*" "exampleSite/public/*" "exampleSite/resources/*" "exampleSite/_gen/*" ".hugo_build.lock" "exampleSite/.hugo_build.lock" 2>/dev/null; then
            echo "::error::Build artifacts must not be tracked (public/, resources/, exampleSite/public, exampleSite/_gen, .hugo_build.lock)"
            git ls-files | grep -E "(^public/|resources/|exampleSite/.*/public/|exampleSite/.*/_gen|\.hugo_build\.lock)"
            exit 1
          fi
          echo "No tracked artifacts."

      - name: Setup Bun
        if: hashFiles('package.json') != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install JS dependencies
        if: hashFiles('package.json') != ''
        run: bun install --frozen-lockfile

      - name: Lint CSS and JS
        if: hashFiles('package.json') != ''
        run: bun run lint:css && bun run lint:js

      - name: Lint CSS token discipline
        shell: bash
        run: |
          set -euo pipefail
          echo "Check: 组件禁止直用 color-mix（应沉淀至 semantic.css）"
          if grep -R --include="*.css" -n "color-mix" assets/css/components assets/css/base -- 2>/dev/null; then
            echo "::error::发现组件层直接使用 color-mix，请改为引用 semantic.css 语义 token (--border-muted/--overlay-fab 等)"
            exit 1
          fi
          echo "Check: 禁止新增硬编码 hex（primitives/semantic/syntax/print 除外）"
          if grep -R --include="*.css" -n -E "#[0-9a-fA-F]{3,8}\b" assets/css/components assets/css/base -- 2>/dev/null | grep -v "data:image/svg" | grep -v "data-uri" | grep -v "豁免" | grep -q .; then
            echo "::error::组件层禁止硬编码 hex 颜色，请使用 hsl 语义 token"
            grep -R --include="*.css" -n -E "#[0-9a-fA-F]{3,8}\b" assets/css/components assets/css/base -- | grep -v "data:image/svg" | grep -v "data-uri" | grep -v "豁免"
            exit 1
          fi
          if grep -R --include="*.css" -n -E "#[0-9a-fA-F]{3,8}\b" assets/css/components assets/css/base -- 2>/dev/null | grep "豁免" | grep -v "data-uri" | grep -v "wash" | grep -v "data:image/svg" | grep -q .; then
            echo "::error::hex 豁免仅允许 data-uri/wash 场景，当前豁免行未含 data-uri/wash"
            grep -R --include="*.css" -n -E "#[0-9a-fA-F]{3,8}\b" assets/css/components assets/css/base -- | grep "豁免" | grep -v "data-uri" | grep -v "wash"
            exit 1
          fi
          echo "CSS token lint OK."

      - name: Build theme example
        run: hugo --source exampleSite --themesDir ../.. --theme hugo-wishingwell-theme --baseURL "https://wildfire2282.github.io/hugo-wishingwell-theme/" --gc --minify --cleanDestinationDir --panicOnWarning --printPathWarnings --noBuildLock

      - name: Check generated URLs (ASCII-only)
        shell: bash
        run: |
          set -euo pipefail
          # 任意非 ASCII 的 percent-encoding 均视为违规（%C0..%FF 起始字节，含 4 字节 %F0..%F7）
          if grep --recursive --extended-regexp --binary-files=text '%[Cc][0-9A-Fa-f]|%[EeDd][0-9A-Fa-f]|%[Ff][0-7][0-9A-Fa-f]' exampleSite/public 2>/dev/null; then
            echo "::error::Found percent-encoded non-ASCII URL (violates ASCII-only contract)"
            grep --recursive --extended-regexp --binary-files=text '%[Cc][0-9A-Fa-f]|%[EeDd][0-9A-Fa-f]|%[Ff][0-7][0-9A-Fa-f]' exampleSite/public || true
            exit 1
          fi
          # 兼容旧检测：%E4..%EF 为常见中文编码 + %F0..%F7 4 字节
          if grep --recursive --extended-regexp '%E[4-9][0-9A-Fa-f]|%F[0-7][0-9A-Fa-f]' exampleSite/public 2>/dev/null; then
            echo "::error::Found legacy %E* / %F* non-ASCII URL"
            exit 1
          fi
          echo "URL ASCII check OK."
      - name: Report bundle size
        if: always()
        shell: bash
        run: |
          ls -lh exampleSite/public/css/* 2>/dev/null | awk '{print $9, $5}' || true
          ls -lh exampleSite/public/js/* 2>/dev/null | awk '{print $9, $5}' || true
          du -sh exampleSite/public 2>/dev/null || true
          # 阈值告警（软门禁）：CSS 80KB / JS 20KB，超阈仅 warning 不阻断
          css=$(stat -c%s exampleSite/public/css/main.*.css 2>/dev/null | head -n1); js=$(stat -c%s exampleSite/public/js/main.*.js 2>/dev/null | head -n1)
          if [ -n "$css" ] && [ "$css" -gt 81920 ]; then echo "::warning::CSS bundle ${css}B exceeds 80KB threshold"; fi
          if [ -n "$js" ] && [ "$js" -gt 20480 ]; then echo "::warning::JS bundle ${js}B exceeds 20KB threshold"; fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: exampleSite/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: hugo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
