name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.1.0
        with:
          enablement: true
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$release/$archive"
          curl --fail --location --silent --show-error --output checksums.txt "$release/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check
          tar --extract --gzip --file "$archive" hugo
          sudo install --mode 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Build site for Pages
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Pages 项目站需带子路径，覆盖根 hugo.toml 的 baseURL
          hugo --gc --minify --cleanDestinationDir --panicOnWarning --printPathWarnings \
            --baseURL "https://wildfire2282.github.io/hugo-wishingwell-theme/"
          echo "Pages build OK: $(du -sh public | cut -f1) / $(ls -1 public/css/*.css public/js/*.js 2>/dev/null | wc -l) bundles"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.1.0
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
